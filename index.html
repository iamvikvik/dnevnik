<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Дневник</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>
:root{--ink:#1c1420;--mut:#8f8697;--line:#f1e6ee;--soft:#f8f1f6;--pk:#ff6fb0;--pk2:#ffd3e8;--pk3:#fff1f8;--lil:#e0d4ff;--blue:#cfeaff;--lime:#e4f9b8;--peach:#ffd9c2;--red:#ff4d6d;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior:none;-webkit-text-size-adjust:100%;overflow:hidden}
body.edopen #app{visibility:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* header */
#top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 16px 8px;background:#fff;z-index:5}
.tabs{flex:1;position:relative;display:flex;background:var(--soft);border-radius:999px;padding:4px}
.tabs button{flex:1;position:relative;z-index:1;padding:10px 0;border-radius:999px;font-weight:700;font-size:15px;color:var(--mut);transition:color .2s}
.tabs button.on{color:var(--ink)}
.tabs .ind{position:absolute;left:4px;top:4px;bottom:4px;width:calc(50% - 4px);background:#fff;border-radius:999px;box-shadow:0 3px 12px rgba(120,60,100,.16);will-change:transform}
.ib{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 18px rgba(80,30,70,.14);display:grid;place-items:center;flex:none;color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib:active{transform:scale(.94)}
.ib.sm{width:38px;height:38px;box-shadow:0 2px 10px rgba(80,30,70,.12)}.ib.sm svg{width:19px;height:19px}
/* pager */
#pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#pager::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.pane.dp{background:linear-gradient(#fff7fb,#fff 420px)}
.wrap{max-width:720px;margin:0 auto;padding:6px 16px calc(150px + var(--sab))}
.h1{font-size:34px;line-height:1.04;letter-spacing:-1.3px;font-weight:800;margin:10px 0 12px}
.dhd{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.streak{font-size:13px;font-weight:700;background:var(--peach);padding:5px 11px;border-radius:999px;margin-bottom:14px;white-space:nowrap}
.streak:empty{display:none}
.sbox{position:relative;margin:0 0 14px}
.sbox svg{position:absolute;left:14px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--mut)}
.sbox input{width:100%;border:0;background:var(--soft);border-radius:16px;padding:13px 14px 13px 42px;font-size:16px;outline:none;-webkit-appearance:none}
.dp .sbox input{background:#fff;box-shadow:0 2px 12px rgba(160,60,110,.08)}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 0;border-radius:16px;background:#fff;box-shadow:0 2px 12px rgba(160,60,110,.08);font-weight:700;font-size:15px;color:var(--mut)}
.seg button svg{width:18px;height:18px}
.seg button.on{background:var(--pk);color:#fff;box-shadow:0 6px 18px rgba(255,111,176,.4)}
.muted{color:var(--mut);font-size:14px;padding:10px 2px}
.empty{text-align:center;color:var(--mut);padding:56px 24px}
.empty .em{font-size:46px;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.empty p{margin:0;line-height:1.45}
.bnr{display:flex;align-items:center;gap:10px;background:var(--lime);border-radius:16px;padding:10px 12px;margin:0 0 14px;font-size:14px;font-weight:600}
.bnr svg{width:22px;height:22px;flex:none}.bnr span{flex:1}
.bnr button{background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px}
/* fabs */
.fab{position:fixed;right:18px;bottom:calc(22px + var(--sab));width:64px;height:64px;border-radius:50%;background:var(--pk);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(255,111,176,.55);z-index:6}
.fab svg{width:30px;height:30px;stroke-width:2.4}
.fab:active{transform:scale(.94)}
.fab2{position:fixed;right:30px;bottom:calc(98px + var(--sab));width:44px;height:44px;border-radius:50%;background:#fff;color:var(--pk);display:grid;place-items:center;box-shadow:0 6px 18px rgba(160,60,110,.22);z-index:6;opacity:0;pointer-events:none}
.fab2 svg{width:21px;height:21px}
/* notes */
.mas{column-count:2;column-gap:12px}
.nc{break-inside:avoid;margin:0 0 12px;border-radius:22px;padding:14px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.nc:active{transform:scale(.985)}
.ncp{margin:-14px -14px 10px;overflow:hidden}.ncp img{width:100%;display:block;object-fit:cover}
.ncp.c{margin:0 0 10px;display:flex;justify-content:center}.ncp.c img{border-radius:50%;width:78%}
.nc b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;line-height:1.2;letter-spacing:-.3px;font-weight:700;word-break:break-word}
.nc p{margin:5px 0 0;font-size:14px;line-height:1.35;color:#5b5063;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.nc small{display:block;margin-top:8px;font-size:12px;color:var(--mut)}
/* diary feed */
.mh{font-size:15px;font-weight:800;margin:20px 2px 8px;color:var(--mut);text-transform:capitalize;letter-spacing:-.2px}
.de{display:flex;gap:12px;background:#fff;border-radius:22px;padding:12px;margin:0 0 10px;box-shadow:0 3px 16px rgba(160,60,110,.09);align-items:flex-start}
.de:active{transform:scale(.985)}
.dd{flex:none;width:50px;text-align:center;background:var(--pk3);border-radius:16px;padding:7px 0}
.dd b{display:block;font-size:22px;line-height:1;font-weight:800;color:var(--pk)}
.dd span{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase}
.dc{flex:1;min-width:0}
.dt{font-weight:700;font-size:17px;letter-spacing:-.3px;line-height:1.2;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc p{margin:3px 0 0;font-size:14px;color:#5b5063;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.dm{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.dm .mo{font-size:17px}
.dm .tg{font-size:12px;font-weight:700;background:var(--soft);border-radius:999px;padding:3px 9px}
.dm .tm{font-size:12px;color:var(--mut);margin-left:auto}
.dth{flex:none;width:58px;height:58px;border-radius:14px;overflow:hidden;background:var(--soft)}
.dth.c{border-radius:50%}.dth img{width:100%;height:100%;object-fit:cover;display:block}
.otd{background:linear-gradient(135deg,var(--lil),var(--pk2));border-radius:22px;padding:13px 14px;margin:0 0 6px}
.otdh{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;margin-bottom:6px}.otdh svg{width:18px;height:18px}
.otdi{padding:6px 0}.otdi+.otdi{border-top:1px solid rgba(255,255,255,.6)}
.otdi small{display:block;color:#6a5b7a;font-size:12px;font-weight:600}.otdi b{font-size:16px;line-height:1.2}
/* calendar */
.cal{background:#fff;border-radius:26px;padding:12px;box-shadow:0 4px 22px rgba(160,60,110,.1)}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calt{font-weight:800;font-size:18px;letter-spacing:-.4px;padding:6px 12px;border-radius:999px;background:var(--pk3)}
.cwd,.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cwd span{text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:4px 0;text-transform:uppercase}
.cd{position:relative;aspect-ratio:1/1.08;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:none}
.cd.e{pointer-events:none}
.cd b{font-size:15px;font-weight:600;line-height:1.15}
.cd span{font-size:15px;line-height:1;height:16px;color:var(--pk)}
.cd.has{background:var(--pk3)}.cd.has b{font-weight:800}
.cd.td b{color:var(--pk)}
.cd.td{box-shadow:inset 0 0 0 2px var(--pk2)}
.cd.sel{background:var(--pk);box-shadow:0 5px 14px rgba(255,111,176,.45)}.cd.sel b,.cd.sel span{color:#fff}
.cd .mv{position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--lil);box-shadow:0 0 0 1px #8d6cf0}
.cd em{position:absolute;right:3px;top:3px;font-style:normal;font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:0 5px;line-height:15px}
.cst{margin:12px 2px 0;font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cst b{color:var(--ink)}
.cmo{display:inline-flex;gap:8px;margin-left:auto;font-size:17px}.cmo small{font-size:11px;font-weight:700;color:var(--mut);margin-left:2px}
.cday{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.cdh{font-weight:800;font-size:16px;margin:0 2px 10px}
.cday .de{box-shadow:0 2px 12px rgba(160,60,110,.12);background:var(--pk3)}
.cday .btn{margin-top:6px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;font-weight:700;font-size:16px}
.btn svg{width:19px;height:19px}
.btn.wide{width:100%}.btn.sm{padding:9px 15px;font-size:15px}
.btn.pink{background:var(--pk);color:#fff;box-shadow:0 6px 18px rgba(255,111,176,.4)}
.btn.ghost{background:var(--soft)}
.btn.red{background:#ffe3e8;color:var(--red)}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px;line-height:1.2}
.chip svg{width:17px;height:17px}.chip small{margin-left:4px;color:var(--mut);font-weight:700}
.chip.on{background:var(--pk);color:#fff}.chip.on small{color:#fff}
.chip.red{background:#ffe3e8;color:var(--red)}
.chip:disabled{opacity:.35}
/* sheets & toast */
.bg{position:fixed;inset:0;background:rgba(40,20,40,.35);opacity:0;transition:opacity .2s;z-index:200}.bg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + var(--sab));z-index:201;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}.sheet.tall{max-height:92vh}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:#e3d8e0;margin:0 auto 12px}
.sheet h3{font-size:22px;letter-spacing:-.6px;margin:4px 0 12px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu .mt{font-weight:700;font-size:15px;color:var(--mut);margin:0 0 4px;word-break:break-word}
.menu button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--soft);font-weight:600;font-size:16px;text-align:left}
.menu button svg{width:22px;height:22px;flex:none}
.menu button span{flex:1}.menu button small{color:var(--mut);font-weight:500;font-size:13px}
.menu button.rd{color:var(--red);background:#fff0f3}
.stat{margin-top:14px;text-align:center;color:var(--mut);font-size:13px}
.ask{font-size:17px;line-height:1.4;margin:6px 2px 16px}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}
.help p{margin:0 0 10px;line-height:1.45;font-size:15px}
.trl{display:flex;flex-direction:column;gap:8px}
.tri{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:16px;padding:10px 12px}
.tri div{flex:1;min-width:0}.tri b{display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tri small{color:var(--mut);font-size:12px}
.yrh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.yrh b{font-size:22px;font-weight:800}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mgrid .chip{padding:13px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--sab));max-width:calc(100% - 32px);background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:14px;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast button{color:var(--pk2);font-weight:800}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
/* editor */
.ed{position:fixed;left:0;right:0;top:0;height:100%;background:#fff;z-index:100;display:flex;flex-direction:column}
.ed.dia{background:#fffafd}
.edtop{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 14px 6px}
.edk{font-weight:700;color:var(--mut);font-size:15px}
.edsc{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.edin{max-width:720px;margin:0 auto;padding:6px 18px 90px}
.dline{font-size:13px;color:var(--mut);margin:0 0 4px}
.datebtn{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--pk3);color:var(--pk);font-weight:700;font-size:15px;border-radius:999px;padding:8px 14px;margin:0 0 8px;max-width:100%}
.datebtn svg{width:16px;height:16px;flex:none}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.ttl{display:block;width:100%;border:0;outline:0;background:none;resize:none;overflow:hidden;font-size:30px;line-height:1.1;letter-spacing:-1px;font-weight:800;padding:4px 0;margin:0 0 6px;-webkit-appearance:none}
.ttl::placeholder{color:#d5c9d3}
.sug{margin:0 0 10px}
.sugh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}.sugh svg{width:15px;height:15px;color:var(--pk)}.sugh span{flex:1}
.sugh button{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(160,60,110,.14);color:var(--pk)}.sugh button svg{width:15px}
.sugc{display:flex;flex-wrap:wrap;gap:6px}
.sugc .chip{background:#fff;box-shadow:0 2px 10px rgba(160,60,110,.1);font-size:14px}.sugc .chip.on{background:var(--pk)}
.moods{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -18px 4px;padding-left:18px;padding-right:18px;scrollbar-width:none}.moods::-webkit-scrollbar{display:none}
.md{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 11px 6px;border-radius:18px;background:#fff;box-shadow:0 2px 10px rgba(160,60,110,.09)}
.md span{font-size:24px;line-height:1.1}.md small{font-size:11px;font-weight:600;color:var(--mut)}
.md.on{background:var(--pk);box-shadow:0 5px 14px rgba(255,111,176,.45)}.md.on small{color:#fff}
.vsec{margin:0 0 12px}
.vr{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px 10px;margin-bottom:8px;box-shadow:0 2px 12px rgba(160,60,110,.1)}
.vp{flex:none;width:42px;height:42px;border-radius:50%;background:var(--pk);color:#fff;display:grid;place-items:center}.vp svg{width:18px;height:18px}
.vb{flex:1;min-width:0}.vb small{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.vs{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--pk2);outline:none;margin:6px 0 2px;display:block}
.vs::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--pk)}
.vs::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--pk)}
.vx{flex:none;width:34px;height:34px;display:grid;place-items:center;color:var(--mut)}.vx svg{width:19px;height:19px}
.rec{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:#fff;box-shadow:0 2px 12px rgba(160,60,110,.12);font-weight:700;font-size:15px;color:var(--pk)}
.rec svg{width:20px;height:20px}
.rec.on{background:var(--red);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,77,109,.2)}}
.blocks{margin-top:4px}
.tb{outline:none;font-size:17px;line-height:1.5;min-height:1.6em;word-break:break-word;padding:2px 0;-webkit-user-select:text;user-select:text;white-space:pre-wrap}
.tb:empty::before{content:attr(data-ph);color:#cfc3cd;pointer-events:none}
.tb h3{font-size:22px;line-height:1.2;margin:.3em 0 .1em;letter-spacing:-.4px}
.tb ul,.tb ol{margin:.2em 0;padding-left:1.4em}
.tb div{white-space:pre-wrap}
.gb{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:flex-start}
.gi{position:relative;border-radius:16px;overflow:hidden;background:var(--soft);cursor:pointer;flex:none}
.gi.sf{width:100%}.gi.sh{width:calc(50% - 4px)}.gi.st{width:calc(33.333% - 5.4px)}
.gi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.gi.k-circ{border-radius:50%}
.gadd{width:calc(33.333% - 5.4px);aspect-ratio:1/1;border-radius:16px;border:2px dashed var(--pk2);color:var(--pk);display:grid;place-items:center;background:var(--pk3)}.gadd svg{width:26px;height:26px}
.idea{display:inline-flex;margin-top:10px;padding:10px 16px;border-radius:999px;background:#fff;box-shadow:0 2px 12px rgba(160,60,110,.12);font-weight:600;font-size:15px}
.edbar{flex:none;display:flex;align-items:center;gap:4px;padding:8px 12px calc(8px + var(--sab));background:rgba(255,255,255,.96);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.edbar button{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px}
.edbar button svg{width:23px;height:23px}
.edbar button.on{background:var(--pk3);color:var(--pk)}
.edbar .sp{flex:1}
/* photo sheet */
.pprev{height:34vh;border-radius:18px;background:var(--soft);display:grid;place-items:center;overflow:hidden;margin-bottom:12px}.pprev img{max-width:100%;max-height:100%;object-fit:contain}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.plab{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:6px 2px}
.sheet .btn.red.wide{margin-top:8px}
.view{position:fixed;inset:0;background:#000;z-index:260;display:grid;place-items:center}.view img{max-width:100%;max-height:100%}
.view .ib{position:absolute;right:14px;top:calc(var(--sat) + 12px);background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
/* crop */
.crop{position:fixed;inset:0;background:#faf3f8;z-index:250;display:flex;flex-direction:column}
.crtop{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 10px) 14px 8px}.crtop b{font-size:16px}
.crmid{flex:1;min-height:0;display:grid;place-items:center;padding:0 16px}
.crfull{max-width:100%;max-height:100%;border-radius:14px}
.cstage{position:relative;overflow:hidden;touch-action:none;background:#ddd;border-radius:14px}
.cstage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cstage::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.cstage.circ{border-radius:14px}
.cstage.circ::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at center,transparent 0,transparent calc(50% - 1px),rgba(25,20,35,.55) 50%)}
.cstage.circ::before{inset:0;border-radius:50%;box-shadow:none;border:2px solid #fff}
.crbot{flex:none;padding:10px 16px calc(16px + var(--sab));max-width:560px;width:100%;margin:0 auto}
.zrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:800;color:var(--mut)}.zrow input{flex:1;accent-color:var(--pk)}
.shapes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.shapes::-webkit-scrollbar{display:none}.shapes .chip{flex:none;background:#fff;box-shadow:0 2px 8px rgba(160,60,110,.1)}.shapes .chip.on{background:var(--pk)}
.hint{text-align:center;color:var(--mut);font-size:13px;margin-top:8px;min-height:18px}
/* lock */
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#ffe3f1,#f0e6ff);z-index:9999;display:grid;place-items:center;padding:20px}
.lk{width:100%;max-width:340px;text-align:center}
.lkic{width:64px;height:64px;border-radius:22px;background:#fff;color:var(--pk);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 8px 24px rgba(255,111,176,.3)}.lkic svg{width:30px;height:30px}
.lk h2{margin:0;font-size:24px;letter-spacing:-.6px}.lkp{color:#6f6078;min-height:22px;margin:6px 0 16px;font-size:15px}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:22px}.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--pk);transition:background .1s}.dots i.on{background:var(--pk)}
.dots.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:240px;margin:0 auto}
.kp button{aspect-ratio:1/1;border-radius:50%;background:#fff;font-size:26px;font-weight:600;box-shadow:0 4px 14px rgba(160,60,110,.12)}.kp button:active{background:var(--pk2)}
.lkb{display:flex;justify-content:center;gap:18px;margin-top:20px}.lkb button{color:#6f6078;font-weight:600;font-size:15px;padding:8px}
.cover{position:fixed;inset:0;background:linear-gradient(160deg,#ffe3f1,#f0e6ff);z-index:9998}
body.locked #app{visibility:hidden}

</style></head>

<script>
'use strict';
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const p2=n=>String(n).padStart(2,'0');
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let SET=Object.assign({tab:0,dview:'feed',pinHash:null,pinSalt:null,pinReset:0,lastBackup:0},lsGet('diary_set',{}));
const saveSet=()=>lsSet('diary_set',SET);
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WDN=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const WDS=['вс','пн','вт','ср','чт','пт','сб','вс'];
const hhmm=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const todayRu=(d=new Date())=>WDN[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
const longDate=ts=>{const d=new Date(ts);return WDN[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()};
const midDate=ts=>{const d=new Date(ts);return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const toLocalInput=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const mmss=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+p2(s%60)};
function plural(n,a,b,c){const m=n%100,k=n%10;return (m>10&&m<20)?c:k===1?a:(k>1&&k<5)?b:c}

/* ===== icons ===== */
const IC=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={

let db=null;const MEM={docs:new Map(),blobs:new Map()};
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('diary_v1',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('docs',{keyPath:'id'});r.result.createObjectStore('blobs',{keyPath:'id'})};
 r.onsuccess=()=>{db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})}
function idb(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbPut=(st,o)=>db?idb(st,'readwrite',s=>s.put(o)):(MEM[st].set(o.id,o),Promise.resolve());
const dbGet=(st,id)=>db?idb(st,'readonly',s=>s.get(id)):Promise.resolve(MEM[st].get(id));
const dbDel=(st,id)=>db?idb(st,'readwrite',s=>s.delete(id)):(MEM[st].delete(id),Promise.resolve());
const dbAll=st=>db?idb(st,'readonly',s=>s.getAll()):Promise.resolve([...MEM[st].values()]);

function plainOf(d){const c=PT.get(d.id);if(c&&c.u===d.updated)return c.t;let t='';
 for(const b of d.blocks){if(b.t==='p')t+=htmlText(b.h)+'\n'}
 t=t.replace(/\n[ \t]*(?=\n)/g,'\n').replace(/\n{3,}/g,'\n\n').trim();PT.set(d.id,{u:d.updated,t});return t}

const BU=new Map();
async function putBlob(id,blob){await dbPut('blobs',{id,blob})}
async function getBlob(id){const r=await dbGet('blobs',id);return r&&r.blob}
async function bUrl(id){if(!id)return'';if(BU.has(id))return BU.get(id);const b=await getBlob(id);if(!b)return'';const u=URL.createObjectURL(b);BU.set(id,u);return u}
async function delBlob(id){if(!id)return;const u=BU.get(id);if(u){URL.revokeObjectURL(u);BU.delete(id)}try{await dbDel('blobs',id)}catch(e){}}
function hydrate(root){$$('img[data-b]',root).forEach(im=>{if(im.dataset.done===im.dataset.b)return;const id=im.dataset.b;bUrl(id).then(u=>{if(u){im.src=u;im.dataset.done=id}})})}

/* ===== images ===== */
async function loadImg(src){const u=src instanceof Blob?URL.createObjectURL(src):src;const im=new Image();im.src=u;
 try{await im.decode()}catch(e){await new Promise((r,j)=>{im.onload=r;im.onerror=()=>j(new Error('img'))})}return {im,u}}
function drawTo(im,sx,sy,sw,sh,dw,dh,q){const c=document.createElement('canvas');c.width=Math.max(1,dw);c.height=Math.max(1,dh);const g=c.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q))}
async function makeSrc(file){const {im,u}=await loadImg(file);const iw=im.naturalWidth,ih=im.naturalHeight;const sc=Math.min(1,2000/Math.max(iw,ih));
 const w=Math.round(iw*sc),h=Math.round(ih*sc);const blob=await drawTo(im,0,0,iw,ih,w,h,.86);URL.revokeObjectURL(u);return {blob,w,h}}
/* display copy: whole image (orig) or the cropped part */
async function makeDisp(im,shape,rect){const iw=im.naturalWidth,ih=im.naturalHeight;
 if(shape==='orig'||!rect){const sc=Math.min(1,1200/Math.max(iw,ih));const w=Math.round(iw*sc),h=Math.round(ih*sc);return {blob:await drawTo(im,0,0,iw,ih,w,h,.86),ar:w/h}}
 const sx=rect.x*iw,sy=rect.y*ih,sw=rect.w*iw,sh=rect.h*ih;const ow=Math.max(1,Math.min(1200,Math.round(sw)));const oh=Math.max(1,Math.round(ow*sh/sw));
 return {blob:await drawTo(im,sx,sy,sw,sh,ow,oh,.88),ar:ow/oh}}

/* ===== cropper (pinch / drag inside a fixed frame) ===== */
function Cropper(stage,img,init){
 const Fw=stage.clientWidth,Fh=stage.clientHeight,iw=img.naturalWidth,ih=img.naturalHeight;
 const s0=Math.max(Fw/iw,Fh/ih);let z=1,tx=0,ty=0;const P=new Map();let pd=0;let onz=null;
 const clamp=()=>{const sc=s0*z;tx=Math.min(0,Math.max(Fw-iw*sc,tx));ty=Math.min(0,Math.max(Fh-ih*sc,ty))};
 const apply=()=>{clamp();img.style.width=iw+'px';img.style.height=ih+'px';img.style.transform=`translate(${tx}px,${ty}px) scale(${s0*z})`;onz&&onz(z)};
 function setZoom(nz,cx=Fw/2,cy=Fh/2){nz=Math.max(1,Math.min(6,nz));const a=s0*z,b=s0*nz,px=(cx-tx)/a,py=(cy-ty)/a;z=nz;tx=cx-px*b;ty=cy-py*b;apply()}
 if(init){const sc=Fw/(init.w*iw);z=Math.max(1,Math.min(6,sc/s0));tx=-init.x*iw*s0*z;ty=-init.y*ih*s0*z}else{tx=(Fw-iw*s0)/2;ty=(Fh-ih*s0)/2}
 apply();
 const pos=e=>{const r=stage.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
 stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);P.set(e.pointerId,pos(e));pd=0});
 stage.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),n=pos(e);
  if(P.size===1){tx+=n.x-o.x;ty+=n.y-o.y;P.set(e.pointerId,n);apply()}
  else if(P.size===2){P.set(e.pointerId,n);const [a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)setZoom(z*d/pd,(a.x+b.x)/2,(a.y+b.y)/2);pd=d}});
 const up=e=>{P.delete(e.pointerId);pd=0};stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
 stage.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);setZoom(z*(e.deltaY<0?1.1:.9),p.x,p.y)},{passive:false});
 return {setZoom,zoom:()=>z,onZoom:f=>{onz=f},rect(){const sc=s0*z;return {x:Math.max(0,-tx/sc/iw),y:Math.max(0,-ty/sc/ih),w:Math.min(1,Fw/sc/iw),h:Math.min(1,Fh/sc/ih)}}}
}

function suggestTitles(d){const text=rawText(d).split('\n').filter(l=>!PROMPTS.includes(l.trim())).join('\n').trim();const out=[];const add=t=>{t=(t||'').trim();if(t&&!out.includes(t))out.push(t)};const dt=new Date(d.date);const [noun,g]=dayPart(dt);

 if(x.getDate()===now.getDate()&&dm>0&&(dm%12===0||dm===1||dm===3||dm===6))out.push({d,dm})});out.sort((a,b)=>a.dm-b.dm);return out.slice(0,2)}

function calStats(by){const {y,m}=CAL;let n=0,v=0;const mo=new Map();by.forEach((l,k)=>{if(Math.floor(k/10000)!==y||Math.floor(k/100)%100!==m+1)return;l.forEach(d=>{n++;if(d.voices&&d.voices.length)v+=d.voices.length;if(d.mood)mo.set(d.mood,(mo.get(d.mood)||0)+1)})});return {n,v,mo}}

 <div class="cst">${st.n?`<b>${st.n} ${plural(st.n,'запись','записи','записей')}</b>${st.v?` · 🎙 ${st.v}`:''}${st.mo.size?'<span class="cmo">'+[...st.mo.entries()].sort((a,b)=>b[1]-a[1]).map(([e,c])=>`${e}<small>${c}</small>`).join('')+'</span>':''}`:'В этом месяце записей нет'}</div>
 <div class="cday"><div class="cdh">${WDN[new Date(sy,sm,sd).getDay()]}, ${sd} ${MONTHS[sm]}${sy!==new Date().getFullYear()?' '+sy:''}</div>${sel.map(entryHTML).join('')||'<div class="muted">В этот день записей нет</div>'}
 <button class="btn pink wide" data-c="add">${ICON.plus}<span>Написать за этот день</span></button></div></div>`}
function monthPicker(){let yr=CAL.y;const by=new Map();diaryDocs().forEach(d=>{const x=new Date(d.date);const k=x.getFullYear()*100+x.getMonth();by.set(k,(by.get(k)||0)+1)});
 const draw=()=>{const el=sheet(`<div class="yrh"><button class="ib sm" data-y="-1">${ICON.back}</button><b>${yr}</b><button class="ib sm" data-y="1">${ICON.back.replace('M15 5l-7 7 7 7','M9 5l7 7-7 7')}</button></div><div class="mgrid">${MONN.map((n,i)=>`<button class="chip${yr===CAL.y&&i===CAL.m?' on':''}" data-m="${i}">${n}${by.get(yr*100+i)?`<small>${by.get(yr*100+i)}</small>`:''}</button>`).join('')}</div>`);

 <div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div>
 <div class="lkb">${o.cancel?'<button data-x="c">Отмена</button>':''}${o.forgot?`<button data-x="f">${esc(o.forgot)}</button>`:''}</div></div>`;
 const dots=$$('#dots i',L),upd=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<v.length));
 L.onclick=e=>{const k=e.target.closest('[data-k]');if(k){if(k.dataset.k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k.dataset.k;upd();
  if(v.length===4){const out=v;v='';setTimeout(()=>{upd();res(out)},140)}return}
  const x=e.target.closest('[data-x]');if(x)res(x.dataset.x==='c'?null:'FORGOT')}})}
const pinClose=()=>{const L=$('#lock');L.classList.add('hide');L.innerHTML=''};
const pinShake=()=>{const d=$('#dots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}};
async function lockFlow(){if(!SET.pinHash||LOCKED)return;LOCKED=true;document.body.classList.add('locked');$('#cover').classList.add('hide');let msg='';
 for(;;){const ready=SET.pinReset&&Date.now()>=SET.pinReset;
  const r=await pinPrompt({title:'Дневник закрыт',sub:msg||'Введи PIN-код',forgot:ready?'Сбросить PIN':'Забыла PIN'});
  if(r==='FORGOT'){
   if(ready){if(confirm('Убрать PIN-код? Все записи останутся на месте.')){SET.pinHash=null;SET.pinSalt=null;SET.pinReset=0;saveSet();break}msg='';continue}
   if(!SET.pinReset){SET.pinReset=Date.now()+24*36e5;saveSet()}
   const h=Math.max(1,Math.ceil((SET.pinReset-Date.now())/36e5));msg='Сбросить PIN можно будет через '+h+' ч. Записи не пропадут.';continue}
  if(r===null)continue;
  if(await sha(SET.pinSalt+r)===SET.pinHash){SET.pinReset=0;saveSet();break}
  msg='Неверный PIN';pinShake();$('#lkp')&&($('#lkp').textContent=msg)}
 pinClose();LOCKED=false;document.body.classList.remove('locked')}
async function pinSettings(){
 if(SET.pinHash){const el=sheet(`<h3>PIN-код</h3><div class="menu"><button data-p="ch">${ICON.pen}<span>Сменить PIN</span></button><button data-p="off" class="rd">${ICON.trash}<span>Выключить PIN</span></button></div>`);
  el.onclick=async e=>{const b=e.target.closest('[data-p]');if(!b)return;closeSheet();
   const cur=await pinPrompt({title:'Текущий PIN',cancel:true});if(cur===null||cur==='FORGOT'){pinClose();return}
   if(await sha(SET.pinSalt+cur)!==SET.pinHash){pinClose();toast('Неверный PIN');return}
   if(b.dataset.p==='off'){pinClose();SET.pinHash=null;SET.pinSalt=null;SET.pinReset=0;saveSet();toast('PIN выключен');return}
   await setPin()}}
 else await setPin()}
async function setPin(){const a=await pinPrompt({title:'Придумай PIN',sub:'4 цифры',cancel:true});if(a===null||a==='FORGOT'){pinClose();return}
 const b=await pinPrompt({title:'Повтори PIN',cancel:true});pinClose();if(b===null||b==='FORGOT')return;if(a!==b){toast('PIN не совпал, попробуй ещё раз');return}
 SET.pinSalt=uid();SET.pinHash=await sha(SET.pinSalt+a);SET.pinReset=0;saveSet();toast('PIN включён. Запиши его где-нибудь надёжно')}
document.addEventListener('visibilitychange',()=>{if(!SET.pinHash)return;
 if(document.hidden){HID=Date.now();if(!LOCKED)$('#cover').classList.remove('hide')}
 else{if(!LOCKED&&Date.now()-HID>30000)lockFlow();else if(!LOCKED)$('#cover').classList.add('hide')}});

/* ---- backup ---- */
async function exportBackup(){toast('Собираю копию…',null,null,0);
 try{const blobs=await dbAll('blobs');const zip=new JSZip();const bt={};blobs.forEach(r=>{bt[r.id]=r.blob.type||'';zip.file('m/'+r.id,r.blob)});
  zip.file('data.json',JSON.stringify({v:1,app:'diary',at:Date.now(),docs:[...DOCS.values()],bt}));
  const out=await zip.generateAsync({type:'blob',compression:'STORE'});const dt=new Date();const name='dnevnik-'+dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+'.zip';
  const file=new File([out],name,{type:'application/zip'});SET.lastBackup=Date.now();saveSet();banner();TOAST&&TOAST.remove();
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Копия дневника'});toast('Копия готова ✓')}catch(e){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove()},1000);toast('Копия сохранена ✓')}}
 catch(err){console.error(err);toast('Не получилось собрать копию')}}
async function importBackup(file){toast('Читаю копию…',null,null,0);
 try{const zip=await JSZip.loadAsync(file);const dj=zip.file('data.json');if(!dj){toast('Это не копия дневника');return}const data=JSON.parse(await dj.async('string'));let nd=0,nb=0;
  for(const [id,type] of Object.entries(data.bt||{})){const f=zip.file('m/'+id);if(!f||await getBlob(id))continue;const b=await f.async('blob');await putBlob(id,new Blob([b],{type:type||'application/octet-stream'}));nb++}
  for(const d of data.docs||[]){const cur=DOCS.get(d.id);if(!cur||(d.updated||0)>(cur.updated||0)){await saveDoc(d,false);nd++}}
  renderAll();toast('Готово: добавлено или обновлено '+nd+' '+plural(nd,'запись','записи','записей'))}
 catch(err){console.error(err);toast('Не смогла прочитать этот файл')}}

/* ---- start ---- */
(async function init(){
 await openDB();const docs=await dbAll('docs');docs.forEach(d=>DOCS.set(d.id,d));await purgeOld();
 buildShell();renderAll();
 requestAnimationFrame(()=>{goTab(SET.tab||0,false)});
 if(SET.pinHash)lockFlow();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
